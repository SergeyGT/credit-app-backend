version: '3.8'

services:
  db_credit_app:
    image: postgres:16
    container_name: db_credit_app
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2411
      POSTGRES_DB: db_credit_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: